<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kossan Shipment Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F7FA;color:#1A2B3C;font-family:'IBM Plex Mono',monospace;min-height:100vh}
.pub-header{background:#fff;padding:18px 24px;border-bottom:1px solid #D0DAE4;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.pub-brand{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;letter-spacing:.08em;color:#1A2B3C}
.pub-sub{font-size:11px;color:#7A94A8;letter-spacing:.06em;margin-top:2px}
.pub-body{padding:20px 24px 60px}
.pub-loading{font-size:12px;color:#7A94A8;padding:60px 0;text-align:center}
.pub-error{font-size:12px;color:#E53935;padding:40px 0;text-align:center}
.range-label{font-size:11px;color:#7A94A8;letter-spacing:.06em}

.cal-top{display:flex;align-items:center;gap:10px;margin:18px 0 16px}
.cal-month-label{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;letter-spacing:.06em;color:#1A2B3C;flex:1}
.cal-today-btn{background:none;border:1px solid #C0CDD8;color:#5A7A90;padding:5px 11px;font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;cursor:pointer;border-radius:2px}
.cal-today-btn:hover{border-color:#5A7A90;color:#1A2B3C}

.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid #D0DAE4;background:#D0DAE4;gap:1px}
.cal-dow{padding:7px 4px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:#5A7A90;background:#EEF3F7;min-width:0}
.cal-dow:first-child{color:#E53935}
.cal-cell{min-height:86px;padding:6px 6px 4px;background:#fff;cursor:pointer;transition:background .1s;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-cell:hover{background:#F0F6FA}
.cal-cell.cal-sel{background:#E8F4FB}
.cal-date-row{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.cal-dn{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:#5A7A90;min-width:14px}
.cal-dn-sun{color:#E53935}
.cal-sun .cal-dn{color:#E53935}
.cal-flags{font-size:13px;line-height:1;display:flex;gap:1px}
.cal-chip{display:flex;align-items:center;gap:3px;padding:2px 5px;border-radius:3px;font-size:9.5px;font-weight:500;overflow:hidden;white-space:nowrap;max-width:100%;min-width:0}
.cal-chip-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cal-chip-type{font-size:8.5px;opacity:.75;flex-shrink:0}
.cal-chip-name{overflow:hidden;text-overflow:ellipsis}
.cal-chip-chg{font-size:8.5px;opacity:0.7;flex-shrink:0;white-space:nowrap}
.cal-chip-first{margin-bottom:0}
.cal-chip-changed{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;padding:0 5px 2px;line-height:1.4}

#cal-detail{margin-top:14px;border:1px solid #D0DAE4;background:#F5F7FA;padding:14px 16px;border-radius:4px}
.cal-detail-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;letter-spacing:.06em;color:#1A2B3C;margin-bottom:10px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.cal-detail-hol{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7A94A8;font-weight:400}
.cal-detail-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #D0DAE4}
.cal-detail-row:last-child{border-bottom:none}
.cal-detail-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.cal-detail-body{flex:1;min-width:0}
.cal-detail-vessel{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:.04em;color:#1A2B3C;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cal-detail-voy{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#7A94A8;font-weight:400}
.cal-detail-bkg{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7A94A8;margin-top:2px}
.cal-detail-dates{display:flex;gap:16px;margin-top:5px;flex-wrap:wrap}
.cal-dt-lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#7A94A8;letter-spacing:.08em;margin-right:4px}
.cal-detail-dates span{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#1A2B3C}
.cal-delay{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:1px 5px;border-radius:2px;background:#E8F5E9;color:#2E7D32}
.cal-delay-alert{background:#FFEBEE;color:#C62828}
.cal-change-badge{font-family:'IBM Plex Mono',monospace;font-size:9.5px;padding:1px 5px;border-radius:2px;background:#E3F2FD;color:#1565C0;letter-spacing:.04em}
.cal-detail-empty{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7A94A8;padding:8px 0}
.cal-empty{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7A94A8;padding:40px 0;text-align:center}

@media(max-width:760px){
  .cal-cell{min-height:60px;padding:4px 2px 2px;min-width:0}
  .cal-dow{font-size:8px;padding:4px 0;min-width:0}
  .cal-chip{font-size:8.5px;padding:1px 4px;min-width:0}
  .cal-chip-name{display:none}
  .cal-month-label{font-size:18px}
  #cal-detail{padding:10px 12px}
  .pub-body{padding:12px 12px 60px}
}

@media print{
  body{background:#fff}
  .pub-header{border-bottom:1px solid #ccc}
  .cal-today-btn{display:none !important}
  .cal-dow{color:#555 !important;background:#f5f5f5 !important}
  .cal-cell{min-height:70px}
  .cal-dn-sun{color:#E53935 !important}
  .cal-chip{border:1px solid #ccc !important}
  #cal-detail{display:none}
}
</style>
</head>
<body>
<div class="pub-header">
  <div>
    <div class="pub-brand">KOSSAN SHIPMENT CALENDAR</div>
    <div class="pub-sub">4-WEEK SCHEDULE · AUTO-UPDATED</div>
  </div>
  <div id="range-label" class="range-label"></div>
</div>
<div class="pub-body">
  <div id="calendar"><div class="pub-loading">Loading schedule…</div></div>
</div>

<script src="https://donghoon2661-prog.github.io/q-report/holidays.js"></script>
<script>
const API_ROOT = 'https://kossan-oqc.dhoqc.workers.dev';

const CAL_PALETTE = [
  { bg:'#FFEBEE', text:'#6B0000', dot:'#C62828' },
  { bg:'#F9FBE7', text:'#4E4C0A', dot:'#9E9D24' },
  { bg:'#E3F2FD', text:'#014670', dot:'#0288D1' },
  { bg:'#FCE4EC', text:'#5E0030', dot:'#AD1457' },
  { bg:'#E8F5E9', text:'#003008', dot:'#00600F' },
  { bg:'#FBE9E7', text:'#7C1E00', dot:'#D84315' },
  { bg:'#F1F8E9', text:'#2D4A16', dot:'#558B2F' },
  { bg:'#E3F2FD', text:'#0D3B6E', dot:'#1565C0' },
  { bg:'#FCE4EC', text:'#6B0033', dot:'#C2185B' },
  { bg:'#E0F2F1', text:'#003D38', dot:'#00796B' },
  { bg:'#FFF3E0', text:'#7C2D00', dot:'#E65100' },
  { bg:'#E8F5E9', text:'#1B3E1D', dot:'#2E7D32' },
  { bg:'#E8EAF6', text:'#111A56', dot:'#283593' },
  { bg:'#FFEBEE', text:'#7A0000', dot:'#E53935' },
  { bg:'#E8EAF6', text:'#141C56', dot:'#303F9F' },
  { bg:'#FFF8E1', text:'#7C3F00', dot:'#FF8F00' },
  { bg:'#E0F7FA', text:'#004B55', dot:'#00838F' },
  { bg:'#EDE7F6', text:'#210F5C', dot:'#4527A0' },
  { bg:'#FFF3E0', text:'#5D1400', dot:'#BF360C' },
  { bg:'#EDE7F6', text:'#3D0A56', dot:'#7B1FA2' },
];

let calItems = [], colorMap = {}, calSelected = null;

function getThisSunday() {
  const now = new Date();
  const sun = new Date(now);
  sun.setDate(now.getDate() - now.getDay());
  sun.setHours(0,0,0,0);
  return sun;
}

function dateStr(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function fmtLabel(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate();
}

function calendarEta(s) {
  const a = typeof s.eta==='string' ? s.eta.slice(0,10) : null;
  const b = typeof s.destEta==='string' ? s.destEta.slice(0,10) : null;
  if (a && b) return a<b?a:b;
  return a||b||null;
}

function buildColorMap(items) {
  const map = {}; let idx = 0;
  for (const it of items) {
    if (!(it.booking in map)) { map[it.booking] = idx % CAL_PALETTE.length; idx++; }
  }
  return map;
}

function buildCalendarItems(shipments) {
  return shipments.filter(s => !s.etaActual).map(s => {
    const cEta = calendarEta(s);
    const etd = s.polDep ? s.polDep.slice(0,10) : null;
    if (!cEta && !etd) return null;
    const firstSeen = typeof s.firstSeenEta==='string' ? s.firstSeenEta.slice(0,10) : null;
    const firstPolDep = typeof s.firstSeenPolDep==='string' ? s.firstSeenPolDep.slice(0,10) : null;
    return {
      booking: s.booking, vessel: s.vessel||'', voyage: s.voyage||null,
      polDep: etd, firstSeenPolDep: (firstPolDep&&firstPolDep!==etd)?firstPolDep:null,
      calendarEta: cEta, firstSeenEta: (firstSeen&&firstSeen!==cEta)?firstSeen:null,
      alert: s.alert||'ok', delayDays: s.delayDays??null,
      etaChangeCount: s.etaChangeCount||0, polDepChangeCount: s.polDepChangeCount||0
    };
  }).filter(Boolean);
}

function buildDateMap(items) {
  const map = {};
  const add = (date, item, type) => {
    if (!date) return;
    if (!map[date]) map[date] = [];
    map[date].push({ item, type });
  };
  for (const it of items) {
    add(it.polDep, it, 'ETD');
    add(it.firstSeenPolDep, it, 'FIRST_ETD');
    add(it.calendarEta, it, 'ETA');
    add(it.firstSeenEta, it, 'FIRST_ETA');
  }
  return map;
}

function fmtCalDate(ds) {
  if (!ds) return '-';
  const [,m,d] = ds.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m,10)-1] + ' ' + parseInt(d,10);
}

function cellHTML(ds, dayNum, dateMap) {
  const holidays = (typeof getHolidays==='function') ? getHolidays(ds) : [];
  const events = dateMap[ds]||[];
  const isSel = ds===calSelected;
  const isSun = new Date(ds+'T00:00:00').getDay()===0;

  const flagsHTML = holidays.length
    ? '<span class="cal-flags">'+holidays.map(h=>h.flag).join('')+'</span>' : '';

  const chipsHTML = events.map(ev => {
    const pal = CAL_PALETTE[colorMap[ev.item.booking]??0];
    const vname = (ev.item.vessel||ev.item.booking).slice(0,9);
    const isFirst = ev.type==='FIRST_ETA'||ev.type==='FIRST_ETD';
    if (isFirst) {
      const fl = ev.type==='FIRST_ETD'?'ETD':'ETA';
      return `<div class="cal-chip cal-chip-first" style="background:transparent;color:${pal.dot};border:1px dashed ${pal.dot};opacity:0.55">` +
             `<span class="cal-chip-dot" style="background:${pal.dot}"></span>` +
             `<span class="cal-chip-name" style="text-decoration:line-through">${fl} ${vname}</span></div>` +
             `<div class="cal-chip-changed" style="color:${pal.dot};opacity:0.55">1ST CHANGE</div>`;
    }
    const ord = n => n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th';
    const etaChg = ev.type==='ETA'&&ev.item.etaChangeCount>0
      ? ` <span class="cal-chip-chg">(${ord(ev.item.etaChangeCount)} change)</span>` : '';
    const etdChg = ev.type==='ETD'&&ev.item.polDepChangeCount>0
      ? ` <span class="cal-chip-chg">(${ord(ev.item.polDepChangeCount)} change)</span>` : '';
    return `<div class="cal-chip" style="background:${pal.bg};color:${pal.text}">` +
           `<span class="cal-chip-dot" style="background:${pal.dot}"></span>` +
           `<span class="cal-chip-type">${ev.type}</span>` +
           `<span class="cal-chip-name">${vname}</span>${etaChg}${etdChg}</div>`;
  }).join('');

  const cls = ['cal-cell', isSel?'cal-sel':'', isSun?'cal-sun':''].filter(Boolean).join(' ');
  return `<div class="${cls}" onclick="selectDate('${ds}')">` +
         `<div class="cal-date-row"><span class="cal-dn${isSun?' cal-dn-sun':''}">${dayNum}</span>${flagsHTML}</div>` +
         chipsHTML + `</div>`;
}

function detailPanelHTML(ds, dateMap) {
  if (!ds) return '';
  const events = dateMap[ds]||[];
  const holidays = (typeof getHolidays==='function') ? getHolidays(ds) : [];
  if (!events.length && !holidays.length) return '';
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dow = days[new Date(ds+'T00:00:00').getDay()];
  const holHTML = holidays.length
    ? '<span class="cal-detail-hol">'+holidays.map(h=>h.flag+'\u00a0'+h.name).join('\u2003·\u2003')+'</span>' : '';
  const rowsHTML = events.map(ev => {
    const it = ev.item;
    const pal = CAL_PALETTE[colorMap[it.booking]??0];
    const delayHTML = typeof it.delayDays==='number'&&it.delayDays!==0
      ? `<span class="cal-delay${it.alert==='alert'?' cal-delay-alert':''}">${it.delayDays>0?'+':''}${it.delayDays}d</span>` : '';
    return `<div class="cal-detail-row">` +
           `<span class="cal-detail-dot" style="background:${pal.dot}"></span>` +
           `<div class="cal-detail-body">` +
           `<div class="cal-detail-vessel">${it.vessel||''}${it.voyage?` <span class="cal-detail-voy">${it.voyage}</span>`:''} ${delayHTML}</div>` +
           `<div class="cal-detail-bkg">${it.booking}</div>` +
           `<div class="cal-detail-dates">` +
           (it.firstSeenPolDep?`<span><span class="cal-dt-lbl">ORIG ETD</span><s>${fmtCalDate(it.firstSeenPolDep)}</s></span>`:'') +
           `<span><span class="cal-dt-lbl">ETD PKG</span>${fmtCalDate(it.polDep)}</span>` +
           (it.firstSeenEta?`<span><span class="cal-dt-lbl">ORIG ETA</span><s>${fmtCalDate(it.firstSeenEta)}</s></span>`:'') +
           `<span><span class="cal-dt-lbl">ETA LA</span>${fmtCalDate(it.calendarEta)}</span>` +
           `</div></div></div>`;
  }).join('');
  return `<div id="cal-detail">` +
         `<div class="cal-detail-title">${fmtCalDate(ds)} (${dow})${holHTML?'&ensp;'+holHTML:''}</div>` +
         (rowsHTML||'<div class="cal-detail-empty">No shipments on this date.</div>') +
         `</div>`;
}

function selectDate(ds) {
  calSelected = calSelected===ds ? null : ds;
  render();
}

function render() {
  const wrap = document.getElementById('calendar');
  if (!wrap) return;
  const sun = getThisSunday();
  const end = new Date(sun);
  end.setDate(sun.getDate() + 27);
  const rangeEl = document.getElementById('range-label');
  if (rangeEl) rangeEl.textContent = fmtLabel(sun) + ' – ' + fmtLabel(end);
  const dateMap = buildDateMap(calItems);
  let html = `<div class="cal-top">` +
    `<span class="cal-month-label">${fmtLabel(sun)} – ${fmtLabel(end)}</span>` +
    `<button class="cal-today-btn" onclick="window.print()">PRINT</button>` +
    `</div>`;
  html += `<div class="cal-grid">`;
  for (const d of ['SUN','MON','TUE','WED','THU','FRI','SAT'])
    html += `<div class="cal-dow">${d}</div>`;
  for (let i = 0; i < 28; i++) {
    const d = new Date(sun);
    d.setDate(sun.getDate() + i);
    html += cellHTML(dateStr(d), d.getDate(), dateMap);
  }
  html += `</div>`;
  html += detailPanelHTML(calSelected, dateMap);
  wrap.innerHTML = html;
}

async function load() {
  try {
    const res = await fetch(API_ROOT + '/data');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    calItems = buildCalendarItems(data.shipments||[]);
    colorMap = buildColorMap(calItems);
    render();
  } catch(e) {
    document.getElementById('calendar').innerHTML =
      `<div class="pub-error">Failed to load schedule: ${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
