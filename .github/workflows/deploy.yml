name: Deploy Worker to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'wrangler.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.toml --keep-vars

      - name: Verify deployment
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, os, sys
          token = os.environ['CF_API_TOKEN']
          account = os.environ['CF_ACCOUNT_ID']
          headers = {"Authorization": f"Bearer {token}"}
          req = urllib.request.Request(
            f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/kossan-oqc/settings",
            headers=headers
          )
          with urllib.request.urlopen(req) as r:
            d = json.loads(r.read())
          bindings = d.get('result', {}).get('bindings', [])
          names = set(b.get('name') for b in bindings)
          print('설정 목록:', sorted(names))
          required = ['OQC', 'ALERT_FROM', 'ALERT_TO', 'ALERT_TO_WEEKLY', 'RESEND_KEY', 'REFRESH_KEY']
          optional = ['ALERT_CC_WEEKLY', 'ALERT_BCC_WEEKLY']
          failed = False
          for item in required:
            if item in names:
              print(f'✅ {item}')
            else:
              print(f'❌ {item} — 필수 설정 없음')
              failed = True
          for item in optional:
            if item in names:
              print(f'✅ {item}')
            else:
              print(f'⚠️  {item} — 선택사항, 미설정')
          if failed:
            print('\n❌ 필수 설정 누락. 배포 실패 처리.')
            sys.exit(1)
          print('\n✅ 모든 필수 설정 확인 완료')
          PYEOF
