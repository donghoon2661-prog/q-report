name: Deploy Worker to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        run: |
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/kossan-oqc" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/javascript" \
            --data-binary @worker.js | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if d.get('success'):
              print('✅ Cloudflare 배포 성공!')
          else:
              print('❌ 실패:', json.dumps(d.get('errors'), ensure_ascii=False))
              exit(1)
          "
