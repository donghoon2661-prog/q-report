name: Daily KV Backup
# 2026-11-04: 백업 파일을 공개 저장소에 커밋하지 않는다(누구나 받을 수 있었음).
# Worker /backup?save=1 이 같은 내용을 KV "backup:<날짜>"(60일)에 남기고, 여기서는 Dropbox 에만 올린다.
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Save backup in Worker KV and fetch it
        env:
          REFRESH_KEY: ${{ secrets.REFRESH_KEY }}
        run: |
          curl -sf -H "X-Refresh-Key: ${REFRESH_KEY}" \
            "https://kossan-oqc.dhoqc.workers.dev/backup?save=1" \
            -o "$RUNNER_TEMP/backup.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('keys', len(d['kv']))" "$RUNNER_TEMP/backup.json"

      - name: Upload to Dropbox
        env:
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          curl -sf -X POST "https://content.dropboxapi.com/2/files/upload" \
            -H "Authorization: Bearer ${DROPBOX_TOKEN}" \
            -H "Dropbox-API-Arg: {\"path\": \"/Github backup/Kossan OQC/${DATE}/backup-${DATE}.json\", \"mode\": \"overwrite\", \"autorename\": false}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$RUNNER_TEMP/backup.json" -o /dev/null \
            && echo "Dropbox upload OK" \
            || echo "::warning::Dropbox upload failed (DROPBOX_TOKEN expired?) - KV copy is still saved"
