name: Daily KV Backup
# 2026-11-04: 백업 파일을 공개 저장소에 커밋하지 않는다(누구나 받을 수 있었음).
# Worker /backup?save=1 이 같은 내용을 KV "backup:<날짜>"(60일)에 남기고, 여기서는 Dropbox 에만 올린다.
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Save backup in Worker KV and fetch it
        env:
          REFRESH_KEY: ${{ secrets.REFRESH_KEY }}
        run: |
          curl -sf -H "X-Refresh-Key: ${REFRESH_KEY}" \
            "https://kossan-oqc.dhoqc.workers.dev/backup?save=1" \
            -o "$RUNNER_TEMP/backup.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('keys', len(d['kv']))" "$RUNNER_TEMP/backup.json"

      - name: Upload to Dropbox
        # 2026-11-04: Dropbox는 4시간짜리 토큰만 주므로 refresh token 으로 매번 새 토큰을 받는다.
        # 앱 "qreport_backup"(앱 폴더) → 대장님 Dropbox 의 앱/qreport_backup/<날짜>/ 에 쌓인다.
        env:
          DBX_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DBX_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DBX_REFRESH: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          RESP=$(curl -sf https://api.dropboxapi.com/oauth2/token -u "${DBX_KEY}:${DBX_SECRET}" -d grant_type=refresh_token -d refresh_token="${DBX_REFRESH}") || { echo "::warning::Dropbox token refresh failed - KV copy is still saved"; exit 0; }
          TOKEN=$(printf '%s' "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          ARG=$(printf '{"path": "/%s/backup-%s.json", "mode": "overwrite", "autorename": false}' "$DATE" "$DATE")
          if curl -sf -X POST https://content.dropboxapi.com/2/files/upload -H "Authorization: Bearer ${TOKEN}" -H "Dropbox-API-Arg: ${ARG}" -H "Content-Type: application/octet-stream" --data-binary "@$RUNNER_TEMP/backup.json" -o /dev/null; then
            echo "Dropbox upload OK: /${DATE}/backup-${DATE}.json"
          else
            echo "::warning::Dropbox upload failed - KV copy is still saved"
          fi
