<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>QC Dashboard — 접근 제한</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E13;--panel:#12161E;--line:#202836;--line2:#2A3446;--text:#E7ECF3;--muted:#7E8AA0;--blue:#4DA3FF;--red:#FF6D5E}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR','Malgun Gothic',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:38px 34px;width:min(400px,100%);text-align:center}
.stamp{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--muted);
  border:1px solid var(--line2);padding:5px 10px;border-radius:3px;display:inline-block;margin-bottom:22px}
.stamp b{color:var(--blue)}
.lock{font-size:30px;margin-bottom:14px}
h1{font-size:17px;font-weight:700;margin-bottom:6px}
p.sub{font-size:12px;color:var(--muted);margin-bottom:24px;line-height:1.6}
form{display:flex;flex-direction:column;gap:10px}
input{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:13px 14px;color:var(--text);
  font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:center;letter-spacing:.1em;outline:none}
input:focus{border-color:var(--blue)}
button{background:var(--blue);color:#0B0E13;border:none;border-radius:8px;padding:13px;font-size:14px;
  font-weight:700;cursor:pointer;font-family:inherit;min-height:48px}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:wait}
.err{font-size:12px;color:var(--red);min-height:18px;margin-top:8px}
.foot{font-size:10px;color:#4A566B;margin-top:22px;font-family:'IBM Plex Mono',monospace}
</style>
</head>
<body>
<div class="card">
  <div class="stamp">OQC REPORT</div>
  <div class="lock">🔒</div>
  <h1>품질 관제 대시보드</h1>

  <form id="f">
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="off" autofocus>
    <button type="submit" id="btn">접속</button>
  </form>
  <div class="err" id="err"></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  const pw = document.getElementById('pw').value;
  if(!pw) return;
  btn.disabled = true; btn.textContent = '확인 중…'; err.textContent = '';
  try {
    const keyMat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(ENC.s), iterations:ENC.it, hash:'SHA-256'},
      keyMat, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.i)}, key, b64(ENC.c));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch(_) {
    err.textContent = '비밀번호가 올바르지 않습니다.';
    btn.disabled = false; btn.textContent = '접속';
    document.getElementById('pw').value=''; document.getElementById('pw').focus();
  }
});
